name: BID-Sleep Missing 147 Recovery

on:
  pull_request:
    branches: [main]
    paths:
      - 'bidsleep_missing_recovery.py'
      - 'research/bidsleep_phase4_6/completed_106_pairs.txt'
      - '.github/workflows/bidsleep-missing-147-recovery.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bidsleep-missing-147-recovery-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate-targeted-recovery
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: research/bidsleep_phase4_6/requirements.txt
      - run: pip install -r research/bidsleep_phase4_6/requirements.txt requests
      - name: Compile and validate completed-pair manifest
        run: |
          python -m py_compile research/bidsleep_phase4_6/pipeline.py research/bidsleep_phase4_6/run_pipeline.py bidsleep_remote_zip_runner.py bidsleep_missing_recovery.py
          test "$(grep -cve '^$' research/bidsleep_phase4_6/completed_106_pairs.txt)" -eq 106

  recover:
    name: missing-recovery-${{ matrix.shard }}
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: research/bidsleep_phase4_6/requirements.txt
      - run: pip install -r research/bidsleep_phase4_6/requirements.txt requests
      - name: Recover assigned missing participant-nights
        run: >-
          python bidsleep_missing_recovery.py
          --index ${{ matrix.shard }}
          --count 6
          --completed research/bidsleep_phase4_6/completed_106_pairs.txt
          --out recovery-output
      - name: Upload recovery output and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: missing-recovery-${{ matrix.shard }}
          path: recovery-output
          if-no-files-found: warn
          retention-days: 30
          compression-level: 9
