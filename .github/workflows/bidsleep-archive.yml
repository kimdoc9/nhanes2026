name: BID-Sleep Phase 5-6 Archive Streaming

on:
  push:
    branches: ['agent/bidsleep-phase4-6']
    paths:
      - 'bidsleep_archive_runner.py'
      - '.github/workflows/bidsleep-archive.yml'
      - 'research/bidsleep_phase4_6/**'
  pull_request:
    branches: [main]
    paths:
      - 'bidsleep_archive_runner.py'
      - '.github/workflows/bidsleep-archive.yml'
      - 'research/bidsleep_phase4_6/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bidsleep-phase4-6-archive
  cancel-in-progress: true

jobs:
  archive-streaming:
    name: download-once-extract-253-nights-aggregate
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Reclaim runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc || true
          df -h
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: research/bidsleep_phase4_6/requirements.txt
      - run: pip install -r research/bidsleep_phase4_6/requirements.txt
      - name: Compile locked pipeline and archive runner
        run: |
          python -m py_compile \
            research/bidsleep_phase4_6/pipeline.py \
            research/bidsleep_phase4_6/run_pipeline.py \
            bidsleep_archive_runner.py
      - name: Download official ZIP once, stream 253 nights, and complete Phase 6
        run: python bidsleep_archive_runner.py --out execution
      - name: Upload Phase 5-6 final outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bidsleep-phase5-6-final
          path: execution/final
          if-no-files-found: warn
          retention-days: 30
          compression-level: 9
      - name: Upload archive diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bidsleep-archive-diagnostics
          path: execution/archive_diagnostics
          if-no-files-found: warn
          retention-days: 30
          compression-level: 9
