name: NHANES Phase 1-3

on:
  push:
    branches: [main]
    paths:
      - 'analysis/phase123.py'
      - '.github/workflows/phase123.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: '1'

jobs:
  phase123:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas numpy scipy scikit-learn requests

      - name: Run frozen Phase 1-3 pipeline
        run: python analysis/phase123.py

      - name: Upload Phase 1-3 bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nhanes_phase123_bundle
          path: artifact/
          if-no-files-found: error
          retention-days: 30
