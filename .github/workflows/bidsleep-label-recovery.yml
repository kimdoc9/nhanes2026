name: BID-Sleep Label Recovery

on:
  push:
    branches: ['agent/bidsleep-phase4-6']
    paths:
      - 'bidsleep_label_recovery.py'
      - '.github/workflows/bidsleep-label-recovery.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bidsleep-label-recovery
  cancel-in-progress: true

jobs:
  recover:
    name: recover-Bidslab30-night6
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: research/bidsleep_phase4_6/requirements.txt
      - run: pip install -r research/bidsleep_phase4_6/requirements.txt
      - name: Compile and recover one label file
        run: |
          python -m py_compile research/bidsleep_phase4_6/pipeline.py research/bidsleep_phase4_6/run_pipeline.py bidsleep_label_recovery.py
          python bidsleep_label_recovery.py
      - name: Upload recovered metric
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bidsleep-label-recovery
          path: recovery-output
          if-no-files-found: warn
          retention-days: 30
          compression-level: 9
